<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>무작위 이름 추첨기</title>
  <!-- 외부 스타일 시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 이름 입력란 -->
    <textarea id="nameInput" placeholder="이름을 쉼표로 구분해 입력하세요"></textarea>
    <br>
    <!-- 시작 버튼 -->
    <button id="startBtn">시작</button>

    <!-- 룰렛 영역 -->
    <div id="wheelContainer">
      <canvas id="wheel" width="400" height="400"></canvas>
      <div id="pointer"></div>
      <!-- 추첨된 이름이 표시될 영역 -->
      <div id="result"></div>
    </div>
  </div>

  <!-- 추첨 로직을 담은 스크립트 -->
  <script src="script.js"></script>
</body>
</html>
